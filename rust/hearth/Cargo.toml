[package]
name = "hearth"
description = "Hearth: one simple home for sharing (folders and chat between the PCs in a house), on RemedyUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Hearth"
path = "src/main.rs"

[dependencies]
hearth-core = { path = "../hearth-core" }
remedy-ui = { path = "../../../../Projects/RemedyUI/crates/remedy-ui", features = ["data", "image", "desktop", "i18n", "update"] }
# Every Remedy typeface, for Settings → General → Font (the engine bundles Remedy Sans UI alone).
remedy-ui-fonts = { path = "../../../../Projects/RemedyUI/crates/remedy-ui-fonts", features = ["remedy-sans", "ahmi-print", "ahmi-pixel"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[build-dependencies]
remedy-ui-build = { path = "../../../../Projects/RemedyUI/crates/remedy-ui-build" }

[dev-dependencies]
remedy-ui = { path = "../../../../Projects/RemedyUI/crates/remedy-ui", features = ["data", "image", "desktop", "i18n", "update", "devtools", "headless"] }
tempfile = "=3.27.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
