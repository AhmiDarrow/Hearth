[workspace]
resolver = "3"
members = ["hearth-core", "hearth"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The group key is PBKDF2-HMAC-SHA256 with 210,000 rounds: slow unoptimized, and tests join groups.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
