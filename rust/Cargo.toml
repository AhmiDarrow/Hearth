[workspace]
resolver = "3"
members = ["hearth-core"]

[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
