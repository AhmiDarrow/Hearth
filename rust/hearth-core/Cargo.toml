[package]
name = "hearth-core"
description = "Hearth's engine: home groups, discovery, the peer protocol (wire-compatible with Hearth 0.3.x), shares, transfers and chat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "multipart", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "multipart", "query"] }
futures-util = "=0.3.31"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
rand = "=0.8.7"
hex = "=0.4.3"
base64 = "=0.23.1"
uuid = { version = "=1.29.3", features = ["v4"] }
if-addrs = "=0.15.0"
socket2 = { version = "=0.6.5", features = ["all"] }
percent-encoding = "=2.3.2"
mime_guess = "=2.0.5"
tokio-util = { version = "=0.7.15", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
