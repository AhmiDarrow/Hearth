name: Windows installer

on:
  push:
    branches: [fix/working-install]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install -e .

      - name: Build Hearth.exe
        run: python -m PyInstaller --noconfirm pack/hearth.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile HearthSetup.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" pack\hearth.iss
          if (-not (Test-Path dist\HearthSetup.exe)) { throw "HearthSetup.exe was not created" }
          Get-Item dist\HearthSetup.exe | Format-List Name, Length, LastWriteTime

      - name: Upload HearthSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: HearthSetup
          path: dist/HearthSetup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/HearthSetup.exe --repo "${{ github.repository }}" --title "Hearth $tag" --prerelease --generate-notes --verify-tag
