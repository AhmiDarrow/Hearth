name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Optional tag to publish after a signed build (e.g. v0.3.1). Leave empty to only build artifacts."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install -e .

      - name: Read version from source of truth
        shell: pwsh
        run: |
          $ver = python -c "from hearth import __version__; print(__version__, end='')"
          $info = python -c "from hearth import __version__; from hearth.update import Version; v = Version.parse(__version__); print(f'{v.major}.{v.minor}.{v.patch}', end='')"
          if (-not $ver) { throw "Could not read hearth.__version__" }
          echo "HEARTH_VERSION=$ver" >> $env:GITHUB_ENV
          echo "HEARTH_VERSION_INFO=$info" >> $env:GITHUB_ENV
          Write-Host "Version $ver (file version $info)"

      - name: Build PyInstaller bootloader from source
        shell: pwsh
        run: |
          $ver = python -c "import PyInstaller; print(PyInstaller.__version__)"
          if (-not $ver) { throw "PyInstaller is not installed" }
          Write-Host "Building PyInstaller $ver bootloader from source"
          $src = Join-Path $env:RUNNER_TEMP "pyinstaller-src"
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          git clone --depth 1 --branch "v$ver" https://github.com/pyinstaller/pyinstaller.git $src
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ build tools were not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $boot = Join-Path $src "bootloader"
          cmd.exe /c "call `"$vcvars`" && cd /d `"$boot`" && python waf all --target-arch=64bit"
          if ($LASTEXITCODE -ne 0) { throw "Bootloader build failed" }
          python -m pip install --force-reinstall --no-deps $src
          python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__path__[0]) / 'bootloader'; print('bootloader at', p)"

      - name: Build Hearth.exe
        run: python -m PyInstaller --noconfirm pack/hearth.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Import signing certificate
        # Never pass signing secrets to pull_request jobs, including same-repo PRs.
        if: github.event_name != 'pull_request'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Signing secrets are not configured; the installer will be unsigned."
            exit 0
          }
          $pfxDir = Join-Path $env:RUNNER_TEMP "hearth-codesign"
          New-Item -ItemType Directory -Force -Path $pfxDir | Out-Null
          $pfxPath = Join-Path $pfxDir "hearth.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          echo "HEARTH_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          echo "HEARTH_SIGN=1" >> $env:GITHUB_ENV

      - name: Sign Hearth.exe
        if: github.event_name != 'pull_request' && env.HEARTH_SIGN == '1'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\sign-file.ps1 dist\Hearth\Hearth.exe

      - name: Compile signed HearthSetup.exe
        if: github.event_name != 'pull_request' && env.HEARTH_SIGN == '1'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Inno treats " in a SignTool command as its own quoting, which turns
          # "C:\path\sign-file.ps1" into \C:\path\sign-file.ps1\. Use a
          # space-free absolute path and let Inno quote $f itself.
          $script = (Resolve-Path .\pack\sign-file.ps1).Path
          $sign = "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File $script `$f"
          & $iscc /O"dist" /DMyAppVersion=$env:HEARTH_VERSION /DMyAppVersionInfo=$env:HEARTH_VERSION_INFO /DSIGNBUILD "/Shearthsign=$sign" pack\hearth.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path dist\HearthSetup.exe)) { throw "HearthSetup.exe was not created" }
          Get-Item dist\HearthSetup.exe | Format-List Name, Length, LastWriteTime

      - name: Compile unsigned HearthSetup.exe
        if: env.HEARTH_SIGN != '1'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /O"dist" /DMyAppVersion=$env:HEARTH_VERSION /DMyAppVersionInfo=$env:HEARTH_VERSION_INFO pack\hearth.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path dist\HearthSetup.exe)) { throw "HearthSetup.exe was not created" }
          Get-Item dist\HearthSetup.exe | Format-List Name, Length, LastWriteTime

      - name: Hash release files
        shell: pwsh
        run: |
          Copy-Item pack\Hearth.cer dist\Hearth.cer
          Copy-Item dist\Hearth\Hearth.exe dist\Hearth.exe
          $names = @("HearthSetup.exe", "Hearth.exe", "Hearth.cer")
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $name
          }
          $lines | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Verify Authenticode thumbprint
        if: env.HEARTH_SIGN == '1'
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-verify-signature.ps1 -Path @("dist\HearthSetup.exe", "dist\Hearth.exe")
          python pack\ci_simulate_update.py --setup dist\HearthSetup.exe --sums dist\SHA256SUMS.txt --from-version 0.3.4

      - name: Refuse to publish unsigned tag releases
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')) && env.HEARTH_SIGN != '1'
        shell: pwsh
        run: throw "Refusing to publish a GitHub Release because the installer was not signed with the Hearth certificate."

      - name: Defender scan Hearth.exe and HearthSetup.exe
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-defender.ps1 -Path @("dist\Hearth\Hearth.exe", "dist\HearthSetup.exe")

      - name: Smoke test Hearth.exe
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "dist\Hearth\Hearth.exe"
          pwsh -NoProfile -File pack\ci-smoke.ps1 -Exe $exe -Port 17474 -HomeDir (Join-Path $env:RUNNER_TEMP "hearth-smoke-built")

      - name: Smoke test cross-peer download
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "dist\Hearth\Hearth.exe"
          pwsh -NoProfile -File pack\ci-peer-smoke.ps1 -Exe $exe

      - name: Smoke test silent install
        shell: pwsh
        run: |
          $setup = Join-Path $pwd "dist\HearthSetup.exe"
          if (-not (Test-Path $setup)) { throw "HearthSetup.exe missing" }
          Write-Host "Installing $setup silently"
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit $($install.ExitCode)" }
          $installed = "C:\Program Files\Hearth\Hearth.exe"
          if (-not (Test-Path $installed)) {
            $installed = Join-Path ${env:LOCALAPPDATA} "Programs\Hearth\Hearth.exe"
          }
          if (-not (Test-Path $installed)) { throw "Installed Hearth.exe was not found" }
          Write-Host "Installed at $installed"
          try {
            pwsh -NoProfile -File pack\ci-smoke.ps1 -Exe $installed -Port 7474 -HomeDir (Join-Path $env:RUNNER_TEMP "hearth-smoke-installed")
          } finally {
            $unins = "C:\Program Files\Hearth\unins000.exe"
            if (-not (Test-Path $unins)) {
              $unins = Join-Path ${env:LOCALAPPDATA} "Programs\Hearth\unins000.exe"
            }
            if (Test-Path $unins) {
              Write-Host "Uninstalling silently"
              $u = Start-Process -FilePath $unins -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
              Write-Host "Uninstaller exit $($u.ExitCode)"
            } else {
              Write-Warning "Uninstaller not found; leaving the CI install in place"
            }
          }

      - name: Defender runtime watch
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-defender.ps1 -Path @("dist\Hearth\Hearth.exe") -LaunchExe "dist\Hearth\Hearth.exe" -RuntimeSeconds 60 -HomeDir (Join-Path $env:RUNNER_TEMP "hearth-defender-runtime") -Port 17475

      - name: Build throwaway newer installer for update E2E
        if: env.HEARTH_SIGN == '1'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-build-e2e-newer.ps1 -ThrowawayVersion "0.3.99-e2e" -OutDir "dist\e2e"

      - name: End-to-end auto-update (previous -> new, new -> newer)
        if: env.HEARTH_SIGN == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "hearth-e2e-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          echo "HEARTH_E2E_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          python -m pip install --quiet cryptography
          $newSetup = "dist\release\HearthSetup.exe"
          $newSums = "dist\release\SHA256SUMS.txt"
          if (-not (Test-Path $newSetup)) { $newSetup = "dist\HearthSetup.exe" }
          if (-not (Test-Path $newSums)) { $newSums = "dist\SHA256SUMS.txt" }
          pwsh -NoProfile -File pack\ci-e2e-update.ps1 `
            -NewSetup $newSetup `
            -NewSums $newSums `
            -NewVersion $env:HEARTH_VERSION `
            -NewerSetup "dist\e2e\HearthSetup.exe" `
            -NewerSums "dist\e2e\SHA256SUMS.txt" `
            -NewerVersion "0.3.99-e2e" `
            -EvidenceDir $evidence `
            -PreviousTags @("v0.3.6", "v0.3.4")
          if (-not (Test-Path (Join-Path $evidence "new-to-newer\PASSED"))) {
            throw "new -> newer E2E did not write a PASSED marker; refusing to publish"
          }

      - name: Upload auto-update E2E evidence
        if: always() && env.HEARTH_E2E_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-update-evidence
          path: ${{ env.HEARTH_E2E_EVIDENCE }}
          if-no-files-found: warn

      - name: Remove signing certificate from the runner
        if: always() && env.HEARTH_PFX_PATH != ''
        shell: pwsh
        run: |
          if (Test-Path $env:HEARTH_PFX_PATH) {
            Remove-Item $env:HEARTH_PFX_PATH -Force
          }
          $dir = Split-Path $env:HEARTH_PFX_PATH
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HearthSetup
          path: |
            dist/HearthSetup.exe
            dist/SHA256SUMS.txt
            dist/Hearth.cer
            dist/release/HearthSetup.exe
            dist/release/SHA256SUMS.txt
            dist/release/Hearth.cer
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')) && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.inputs.publish_tag }}
        shell: pwsh
        run: |
          $passed = Join-Path $env:HEARTH_E2E_EVIDENCE "new-to-newer\PASSED"
          if ($env:HEARTH_SIGN -eq "1" -and -not (Test-Path $passed)) {
            throw "Refusing to publish to Latest: new -> newer auto-update E2E did not pass."
          }
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $tag = $env:GITHUB_REF_NAME
            $verify = $true
          } else {
            $tag = $env:DISPATCH_TAG.Trim()
            $verify = $false
          }
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v, got: $tag" }
          $prerelease = $tag.Contains("-")
          $args = @(
            "release", "create", $tag,
            ($(if (Test-Path "dist/release/HearthSetup.exe") { "dist/release/HearthSetup.exe" } else { "dist/HearthSetup.exe" })),
            ($(if (Test-Path "dist/release/SHA256SUMS.txt") { "dist/release/SHA256SUMS.txt" } else { "dist/SHA256SUMS.txt" })),
            ($(if (Test-Path "dist/release/Hearth.cer") { "dist/release/Hearth.cer" } else { "dist/Hearth.cer" })),
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "Hearth $tag",
            "--generate-notes"
          )
          if ($verify) { $args += "--verify-tag" }
          else { $args += @("--target", $env:GITHUB_SHA) }
          if ($prerelease) { $args += "--prerelease" } else { $args += "--latest" }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release $tag already exists; leaving it in place."
            exit 0
          }
          gh @args
