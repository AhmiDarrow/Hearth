name: Windows installer

# Hearth 1.0 and later is the native program in rust/ (on RemedyUI). It is built and tested
# on the owner's PC (pack/build-release.ps1: the Rust tests, the release program, and a
# throwaway newer one for the update check) and uploaded unsigned to a draft release.
#
# This workflow runs on GitHub's own machines. It signs the program with the Hearth
# certificate, builds HearthSetup.exe, and then installs and updates it for real: a fresh
# install, an install over 0.3.8, a half-install; 0.3.8, 0.3.15 and 0.4.0 updating
# themselves to it; and it updating itself to the newer one, each keeping the profile, the
# port and one running Hearth. Only then are the signed files put on the draft.
#
# Publishing the draft makes it Latest, which is what installed Hearths read.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release to sign, check and fill (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python tools/check_locales.py
          pytest -q

  release:
    name: Sign, build Setup, install and update
    # Never on pull requests: this job holds the signing certificate.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HEARTH_CI: "1"
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install the checks' dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch the programs from the draft
        shell: pwsh
        run: |
          if (-not $env:TAG.StartsWith("v")) { throw "Release tag must start with v, got: $env:TAG" }
          $ver = $env:TAG.Substring(1)
          $line = Select-String -Path rust\Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $source = $line.Matches[0].Groups[1].Value
          if ($source -ne $ver) { throw "$env:TAG is not rust/Cargo.toml's version ($source)" }
          $newer = python -c "from hearth.update import Version; v = Version.parse('$ver'); print(f'{v.major}.{v.minor + 1}.0-e2e', end='')"
          if (-not $newer) { throw "Could not derive the throwaway newer version" }
          New-Item -ItemType Directory -Force -Path dist\upload | Out-Null
          foreach ($v in @($ver, $newer)) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir dist\upload --pattern "Hearth_${v}_unsigned.exe"
            if ($LASTEXITCODE -ne 0) { throw "The draft $env:TAG has no Hearth_${v}_unsigned.exe (run pack\build-release.ps1 -Upload)" }
          }
          echo "HEARTH_VERSION=$ver" >> $env:GITHUB_ENV
          echo "HEARTH_E2E_NEWER=$newer" >> $env:GITHUB_ENV
          Write-Host "Version $ver, update check installs $newer"

      - name: Install Inno Setup and the unpackers
        shell: pwsh
        run: |
          $iscc = $null
          try { $iscc = (pwsh -NoProfile -File pack\find-iscc.ps1).Trim() } catch { $iscc = $null }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = (pwsh -NoProfile -File pack\find-iscc.ps1).Trim()
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw "ISCC.exe was not found after install" }
          echo "HEARTH_ISCC=$iscc" >> $env:GITHUB_ENV
          # The update checks unpack the published 0.x Setups instead of running them. Those
          # were built with a current Inno Setup, which only innounp 2 reads (Chocolatey's
          # innounp and innoextract are too old): one exact build of it, checked.
          $commit = "5410e03e6ad409ac982ca9cb2365db815a8b53fb"
          $want = "078ddb005aa17e669f0b5545980bff92200f7401418174172dca0d75f9e5d8f0"
          $dir = Join-Path $env:RUNNER_TEMP "innounp"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir "innounp-2.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip -Uri "https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/$commit/innounp-2/bin/innounp-2.zip"
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "innounp-2.zip is $got, expected $want" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          if (-not (Test-Path (Join-Path $dir "innounp.exe"))) { throw "innounp.exe was not in the archive" }
          echo $dir >> $env:GITHUB_PATH

      - name: Import signing certificate
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            throw "Refusing to build a release: the signing secrets are not configured."
          }
          $pfxDir = Join-Path $env:RUNNER_TEMP "hearth-codesign"
          New-Item -ItemType Directory -Force -Path $pfxDir | Out-Null
          $pfxPath = Join-Path $pfxDir "hearth.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          echo "HEARTH_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          echo "HEARTH_SIGN=1" >> $env:GITHUB_ENV

      - name: Sign and build the newer HearthSetup.exe for the update check
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-package.ps1 -Exe "dist\upload\Hearth_$($env:HEARTH_E2E_NEWER)_unsigned.exe" -Version $env:HEARTH_E2E_NEWER -OutDir dist\e2e
          if ($LASTEXITCODE -ne 0) { throw "Packaging the newer build failed" }

      - name: Sign Hearth.exe and build HearthSetup.exe
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-package.ps1 -Exe "dist\upload\Hearth_$($env:HEARTH_VERSION)_unsigned.exe" -Version $env:HEARTH_VERSION -OutDir dist
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }

      - name: Verify Authenticode thumbprint
        shell: pwsh
        run: |
          # Called in this shell: a list of paths reaches the script whole only that way.
          & pack\ci-verify-signature.ps1 -Path @("dist\HearthSetup.exe", "dist\Hearth.exe", "dist\e2e\HearthSetup.exe")
          python pack\ci_simulate_update.py --setup dist\HearthSetup.exe --sums dist\SHA256SUMS.txt --from-version 0.3.4
          if ($LASTEXITCODE -ne 0) { throw "The 0.x updater would not accept this Setup" }

      - name: Record job start for Defender gating
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString("o")
          echo "HEARTH_JOB_START=$stamp" >> $env:GITHUB_ENV

      - name: Defender scan Hearth.exe and HearthSetup.exe
        shell: pwsh
        run: |
          & pack\ci-defender.ps1 -Path @("dist\Hearth\Hearth.exe", "dist\HearthSetup.exe")

      - name: Smoke test Hearth.exe
        shell: pwsh
        run: |
          pwsh -NoProfile -File pack\ci-smoke.ps1 -Exe "dist\Hearth\Hearth.exe" -Port 17474 -HomeDir (Join-Path $env:RUNNER_TEMP "hearth-smoke-built")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed" }

      - name: Defender runtime watch
        shell: pwsh
        run: |
          & pack\ci-defender.ps1 -Path @("dist\Hearth\Hearth.exe") -LaunchExe "dist\Hearth\Hearth.exe" -RuntimeSeconds 60 -HomeDir (Join-Path $env:RUNNER_TEMP "hearth-defender-runtime") -Port 17475

      - name: Install scenarios (fresh, update from 0.3.8, half-install)
        shell: pwsh
        run: |
          python pack\ci_install_scenarios.py --setup dist\HearthSetup.exe --payload dist\Hearth --previous-tag v0.3.8 --expect-version $env:HEARTH_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Install scenarios failed with exit $LASTEXITCODE" }

      - name: End-to-end auto-update (previous -> new, new -> newer)
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "hearth-e2e-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          echo "HEARTH_E2E_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          python pack\ci_e2e_update.py `
            --new-setup dist\HearthSetup.exe `
            --new-sums dist\SHA256SUMS.txt `
            --new-version $env:HEARTH_VERSION `
            --newer-setup dist\e2e\HearthSetup.exe `
            --newer-sums dist\e2e\SHA256SUMS.txt `
            --newer-version $env:HEARTH_E2E_NEWER `
            --evidence-dir $evidence `
            --previous-tags "v0.3.8,v0.3.15,v0.4.0"
          if ($LASTEXITCODE -ne 0) { throw "E2E update test failed with exit $LASTEXITCODE" }
          foreach ($case in @("new-to-newer", "previous-to-new\v0.3.8", "previous-to-new\v0.3.15", "previous-to-new\v0.4.0")) {
            if (-not (Test-Path (Join-Path $evidence "$case\PASSED"))) {
              throw "$case did not write a PASSED marker; refusing to fill the draft"
            }
          }

      - name: Upload auto-update E2E evidence
        if: always() && env.HEARTH_E2E_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-update-evidence
          path: ${{ env.HEARTH_E2E_EVIDENCE }}
          if-no-files-found: warn

      - name: Remove signing certificate from the runner
        if: always() && env.HEARTH_PFX_PATH != ''
        shell: pwsh
        run: |
          if (Test-Path $env:HEARTH_PFX_PATH) { Remove-Item $env:HEARTH_PFX_PATH -Force }

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HearthSetup
          path: |
            dist/HearthSetup.exe
            dist/SHA256SUMS.txt
            dist/Hearth.cer
          if-no-files-found: warn

      - name: Put the signed files on the draft
        if: success()
        shell: pwsh
        run: |
          $evidence = $env:HEARTH_E2E_EVIDENCE
          foreach ($case in @("new-to-newer", "previous-to-new\v0.3.8", "previous-to-new\v0.3.15", "previous-to-new\v0.4.0")) {
            if (-not (Test-Path (Join-Path $evidence "$case\PASSED"))) {
              throw "Refusing to fill the draft: $case auto-update E2E did not pass."
            }
          }
          gh release upload $env:TAG dist\HearthSetup.exe dist\SHA256SUMS.txt dist\Hearth.cer --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload to the draft failed" }
          # The unsigned programs were only this job's input.
          foreach ($v in @($env:HEARTH_VERSION, $env:HEARTH_E2E_NEWER)) {
            gh release delete-asset $env:TAG "Hearth_${v}_unsigned.exe" --repo $env:GITHUB_REPOSITORY --yes
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
