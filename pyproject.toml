[project]
name = "hearth"
version = "0.3.0-beta"
description = "HomeGroup for the whole house — local file sharing and PC-to-PC chat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmi Darrow" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
    "zeroconf>=0.136.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "ifaddr>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pywebview>=5.0", "pystray>=0.19.5", "pillow>=10.0.0"]

[project.scripts]
hearth = "hearth.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.setuptools.package-data]
hearth = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
