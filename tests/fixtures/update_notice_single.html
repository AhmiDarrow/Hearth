<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scheme="dark">
<head>
  <meta charset="utf-8" />
  <title>Hearth update notice — single in-place bar</title>
  <link rel="stylesheet" href="../../hearth/ui/static/themes.css" />
  <link rel="stylesheet" href="../../hearth/ui/static/app.css" />
  <style>
    html, body { margin: 0; background: var(--bg, #161411); color: var(--ink, #f3ece4); font: 13px/1.4 system-ui, sans-serif; width: 880px; }
    .demo-shell { min-height: 220px; }
    .toasts { bottom: 16px; right: 16px; }
    .caption { padding: 12px 16px; color: var(--muted, #b9afa4); font-size: 12px; }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div id="chrome" class="chrome">
      <button class="btn ghost icon menu-btn" type="button" aria-label="Menu">☰</button>
      <div class="chrome-brand">
        <span id="chromeTitle">Hearth</span>
      </div>
      <div class="chrome-spacer"></div>
      <button class="btn ghost icon" type="button" aria-label="Settings">⚙</button>
    </div>
    <div id="updateBanner" class="update-banner">
      <span id="updateBannerLabel">Downloading update…</span>
      <div class="bar"><span id="updateBannerBar" style="width: 47%"></span></div>
      <span id="updateBannerPct">47%</span>
    </div>
    <p class="caption">One progress bar, updated in place. Download percent, then Installing… — no stacked toasts.</p>
    <div class="toasts" id="toasts"></div>
  </div>
</body>
</html>
